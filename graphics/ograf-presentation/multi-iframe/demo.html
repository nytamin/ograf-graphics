<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Iframe Demo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #0f1220;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      ograf-multi-iframe {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import MultiIframe from "./multi-iframe.js";

      const ELEMENT_TAG = "ograf-multi-iframe";

      // Edit this object to quickly set up your preferred tile arrangement.
      const DEFAULT_DATA = {
        interactive: 70,
        iframes: [
          {
            title: "",
            url: "",
            x: 1,
            y: 3.5,
            width: 49,
            height: 47,
            scale: 1,
            rank: 10,
          },
           {
            title: "",
            url: "",
            x: 51,
            y: 3.5,
            width: 49,
            height: 47,
            scale: 1,
            rank: 20,
          },
          {
            title: "",
            url: "",
            x: 1,
            y: 54,
            width: 49,
            height: 47,
            scale: 1,
            rank: 30,
          },


          {
            title: "",
            url: "",
            x: 51,
            y: 54,
            width: 49,
            height: 47,
            scale: 1,
            rank: 40,
          },
        ],
      };

      if (!customElements.get(ELEMENT_TAG)) {
        customElements.define(ELEMENT_TAG, MultiIframe);
      }

      const app = document.getElementById("app");
      const graphic = document.createElement(ELEMENT_TAG);
      app.appendChild(graphic);

      await graphic.load({ data: DEFAULT_DATA });
      await graphic.playAction({ skipAnimation: true });
    </script>
  </body>
</html>
