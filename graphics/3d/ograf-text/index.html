<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGraf — Brushed Aluminium Text</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #11151a;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(60, 75, 88, 0.6), transparent 48%),
          linear-gradient(135deg, #1e242b, #07090b 68%);
      }

      .preview-shell {
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
        margin: auto;
        position: relative;
        overflow: hidden;
        background-image:
          linear-gradient(45deg, rgba(255,255,255,.035) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255,255,255,.035) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255,255,255,.035) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.035) 75%);
        background-size: 28px 28px;
        background-position: 0 0, 0 14px, 14px -14px, -14px 0;
      }

      ograf-metallic-text {
        display: block;
        width: 100%;
        height: 100%;
      }

      .ui {
        position: fixed;
        left: 24px;
        bottom: 20px;
        z-index: 2;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #b7c0c9;
        font-size: 12px;
        letter-spacing: .09em;
        text-transform: uppercase;
        user-select: none;
      }

      .ui code {
        color: #eef3f7;
        font: inherit;
        letter-spacing: .02em;
        text-transform: none;
      }

      .ui input {
        width: 190px;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 5px;
        padding: 7px 9px;
        color: #eef3f7;
        background: rgba(9, 12, 15, .76);
        outline: none;
      }

      .ui input:focus { border-color: rgba(210, 228, 241, .62); }

      .ui select {
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 5px;
        padding: 7px 9px;
        color: #eef3f7;
        background: rgba(9, 12, 15, .76);
        outline: none;
      }

      .ui button {
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 5px;
        padding: 7px 10px;
        color: #eef3f7;
        background: rgba(9, 12, 15, .76);
        cursor: pointer;
      }

      .ui button:hover { background: rgba(35, 44, 52, .9); }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <ograf-metallic-text id="graphic"></ograf-metallic-text>
    </main>
    <div class="ui" aria-label="Preview controls">
      <label for="title">Title</label>
      <input id="title" value="OGRAF GRAPHICS" />
      <label for="subtitle">Subtitle</label>
      <input id="subtitle" value="CONNECTED MOTION" />
      <label for="topMaterial">Top material</label>
      <select id="topMaterial">
        <option value="brushedAluminium">Brushed aluminium</option>
        <option value="glossyOrangePlastic">Glossy orange plastic</option>
        <option value="reflectiveChrome">Reflective chrome</option>
      </select>
      <label for="bottomMaterial">Bottom material</label>
      <select id="bottomMaterial">
        <option value="brushedAluminium">Brushed aluminium</option>
        <option value="glossyOrangePlastic">Glossy orange plastic</option>
        <option value="reflectiveChrome">Reflective chrome</option>
      </select>
      <button id="replay" type="button">Replay</button>
      <code>1920 × 1080 · transparent canvas</code>
    </div>
    <script type="module">
      import OGrafMetallicText from './src/ograf-text-graphic.js';

      if (!customElements.get('ograf-metallic-text')) {
        customElements.define('ograf-metallic-text', OGrafMetallicText);
      }

      const graphic = document.querySelector('#graphic');
      const title = document.querySelector('#title');
      const subtitle = document.querySelector('#subtitle');
      const topMaterial = document.querySelector('#topMaterial');
      const bottomMaterial = document.querySelector('#bottomMaterial');

      const update = () => graphic.updateAction({
        data: {
          title: title.value,
          subtitle: subtitle.value,
          topMaterial: topMaterial.value,
          bottomMaterial: bottomMaterial.value
        }
      });

      graphic.load({
        data: {
          title: title.value,
          subtitle: subtitle.value,
          topMaterial: topMaterial.value,
          bottomMaterial: bottomMaterial.value
        },
        renderType: 'realtime',
        renderCharacteristics: { width: 1920, height: 1080 }
      }).then(() => graphic.playAction({ goto: 0 }));

      title.addEventListener('input', update);
      subtitle.addEventListener('input', update);
      topMaterial.addEventListener('change', update);
      bottomMaterial.addEventListener('change', update);
      document.querySelector('#replay').addEventListener('click', () => {
        graphic.stopAction({ skipAnimation: true }).then(() => graphic.playAction({ goto: 0 }));
      });
    </script>
  </body>
</html>
